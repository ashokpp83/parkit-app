name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and migration check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parkit_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: parkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parkit_test -d parkit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Run backend tests against an isolated PostgreSQL database
        env:
          PARKIT_TEST_DATABASE: Host=localhost;Port=5432;Database=parkit_test;Username=parkit_test;Password=test_only
        run: dotnet test Source/backend/ParkIt.Tests/ParkIt.Tests.csproj --configuration Release
      - name: Install EF CLI
        run: dotnet tool install --global dotnet-ef --version 9.0.1
      - name: Check for pending model changes
        env:
          ConnectionStrings__Default: Host=localhost;Port=5432;Database=parkit;Username=parkit;Password=local
        run: dotnet ef migrations has-pending-model-changes --project Source/backend/ParkIt.Infrastructure --startup-project Source/backend/ParkIt.Api --configuration Release

  frontend:
    name: Frontend build and browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Source/parkit-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Source/parkit-ui/package-lock.json
      - run: npm ci
      - name: Build production frontend
        run: npm run build
      - name: Run headless Chrome tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
